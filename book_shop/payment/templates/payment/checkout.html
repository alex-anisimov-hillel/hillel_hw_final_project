<!DOCTYPE html>
<html>
{% load i18n %}
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% translate "Checkout" %}</title>
    <script src="https://js.stripe.com/v3/"></script>
</head>
<body>
    <div>
        <h1>{% translate "Order" %} #{{ order.id }} {% translate "checkout" %}</h1>
        <div>
            <label for="amount">{% translate "Amount" %}</label>
            <input type="number" id="amount" value="{{ order.total_price }}" min="0.50" step="0.01">
        </div>
        <div>
            <label for="currency">{% translate "Currency" %}</label>
            <select id="currency">
                <option value="usd" selected>USD</option>
                <option value="uah">UAH</option>
                <option value="eur">EUR</option>
            </select>
        </div>
        <div>
            <label for="description">{% translate "Payment description" %}</label>
            <input id="description" type="text" placeholder={% translate "Add your comments here (optional)" %}>
        </div>
        <div>
            <label>{% translate "Card details" %}</label>
            <div id="payment-element"></div>
        </div>
        <button id="submit-btn" disabled>{% translate "Checkout" %}</button>
        <div id="message"></div>
    </div>
    <script>
        const STRIPE_PUBLIC_KEY = '{{ stripe_public_key }}';
        const API_URL = '/payment/payments'
        const orderID = '{{ order.id }}';

        const stripe = Stripe(STRIPE_PUBLIC_KEY)
        let elements, paymentElement, clientSecret, paymentID;

        const submitButton = document.getElementById('submit-btn')
        const messageDiv = document.getElementById('message')

        async function createPaymentIntent() {
                    const csrfToken = getCookie('csrftoken')
                    const response = await fetch(`${API_URL}/create_payment_intent/`,{
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': csrfToken,
                        },
                    body: JSON.stringify({
                        amount: document.getElementById('amount').value,
                        currency: document.getElementById('currency').value,
                        description: document.getElementById('description').value}),
                    });
                    if ( !response.ok ) {
                        const error = await response.json();
                        throw new Error(error.error || `HTTP ${response.status}`);
                    }
                    const data = await response.json();
                    if ( !data.client_secret ) {
                        throw new Error(
                            'Client secret is required.'
                        )
                    }
                    clientSecret = data.client_secret;
                    paymentID = data.payment_id;
                    return data;
                }
        async function mountPaymentElement() {
            await createPaymentIntent();
            elements = stripe.elements({
                clientSecret: clientSecret,
                appearance: {theme: 'stripe'}
            });
            paymentElement = elements.create('payment', {layout: 'tabs'});
            paymentElement.mount('#payment-element');
            submitButton.disabled = false;
        }
        async function handlePayment() {
            submitButton.disabled = true;
            try {
                const {error, paymentIntent} = await stripe.confirmPayment({
                    elements,
                    confirmParams: {return_url: window.location.origin + '/checkout/?success=true'},
                    redirect: 'if_required',
                });
                if ( error ) {
                    messageDiv.textContent = error.message;
                } else if (paymentIntent && paymentIntent.status === 'succeeded') {
                    messageDiv.textContent = 'Payment successfully processed, Payment ID: ' + paymentID;
                    confirmOnBackend(paymentID);
                } else if ( paymentIntent ) {
                    messageDiv.textContent = `Status: ${paymentIntent.status}`;
                }
            } catch (error) {
                messageDiv.textContent = error.message;
            } finally {
                submitButton.disabled = false;
            }
        }
        async function confirmOnBackend(paymentID) {
            try {
                const csrfToken = getCookie('csrftoken');
                const response = await fetch (`${API_URL}/${paymentID}/confirm_payment/`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': csrfToken,},
                    body: JSON.stringify({ order_id: orderID })
                });
                if (!response.ok) console.warn('Confirmation failed with status', response.status);
            } catch ( error ) {
                console.warn('Confirmation failed, error: ', error);
            }
        }
        getCookie = (name) => {
            const value = `; ${document.cookie}`;
            const parts = value.split(`; ${name}=`);
            if (parts.length === 2) return parts.pop().split(';').shift();
            return '';
        }
        document.addEventListener('DOMContentLoaded', () => {
            submitButton.addEventListener('click', handlePayment);
            mountPaymentElement().catch(error => {
                messageDiv.textContent = `Payment elements init error: ${error.message}`
            });
        })
        if (new URLSearchParams(window.location.search).get('success') === 'true') {
            document.addEventListener('DOMContentLoaded', () => {
                messageDiv.textContent = 'Payment successfully processed'
            });
        }
    </script>
</body>
</html>
