<!DOCTYPE html>
<html lang="en">
{% load i18n %}
<body>
    <div>
        {% load i18n %}
        <form action="{% url 'set_language' %}" method="post">{% csrf_token %}
            <input name="next" type="hidden" value="{{ redirect_to }}">
            <select name="language">
                {% get_current_language as LANGUAGE_CODE %}
                {% get_available_languages as LANGUAGES %}
                {% get_language_info_list for LANGUAGES as languages %}
                {% for language in languages %}
                    <option value="{{ language.code }}"{% if language.code == LANGUAGE_CODE %} selected{% endif %}>
                        {{ language.name_local }} ({{ language.code }})
                    </option>
                {% endfor %}
            </select>
            <input type="submit" value="Go">
        </form>
            <a href="{% url 'payment:cart_detail' %}">{% translate "View cart" %}</a>
        {% for book in books %}
        <div>
            <p>{% translate "Name: " %}{{book.title}}</p>
            <p>{% translate "Price: " %}{{book.price}}</p>
            <p>{% translate "In Stock: " %}{{book.stock}}</p>
        </div>
        <div>
            <form action="{% url 'payment:cart_add' book.id %}" method="post">
                {% csrf_token %}
                <input type="number" name="quantity" value="1" min="1">
                <button type="submit">{% translate "Add to cart" %}</button>
            </form>
        </div>
        {% endfor %}
    </div>
</body>
</html>
