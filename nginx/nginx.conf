# One nginx for both projects:
#   :80   -> ProjectA  (book shop)
#   :8001 -> ProjectB  (warehouse service: dashboard, admin, REST API, Swagger)

upstream django {
    server web:8000;
}

upstream warehouse {
    server warehouse-web:8000;
}

# Reuse the caller's X-Request-ID or mint a new one (log correlation across services).
map $http_x_request_id $req_id {
    default $http_x_request_id;
    ""      $request_id;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 10M;

    location /static/ {
        alias /srv/static/book_shop/;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    location / {
        proxy_pass http://django;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $req_id;
        proxy_redirect off;
    }
}

server {
    listen 8001;
    server_name _;
    client_max_body_size 5M;

    location /static/ {
        alias /srv/static/support/;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    location / {
        proxy_pass http://warehouse;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $req_id;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_redirect off;
    }
}
