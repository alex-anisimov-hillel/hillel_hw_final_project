# One compose file, one Dockerfile, one image for both projects.
#   ProjectA  book_shop/  -> http://localhost        (web, celery, celery-beat)
#   ProjectB  support/    -> http://localhost:8001   (warehouse-web, warehouse-celery, warehouse-celery-beat)
# Shared infrastructure: one nginx, one Redis (separate logical DBs), one Postgres
# server per project (separate databases and credentials).
#
# Docker DNS names are used as HTTP hosts, and Django rejects hosts with underscores,
# so the HTTP services use hyphens (warehouse-web) - not warehouse_web.

x-app: &app
  build:
    context: .
    dockerfile: Dockerfile
  networks:
    - books_shop_network

# --- ProjectA (book shop) ---------------------------------------------------
x-bookshop-env: &bookshop-env
  # `web` is the Docker DNS name the warehouse service uses for its webhook calls.
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1},web
  WAREHOUSE_ENABLED: ${WAREHOUSE_ENABLED:-False}
  WAREHOUSE_API_URL: http://warehouse-web:8000/api
  WAREHOUSE_SERVICE_EMAIL: ${WAREHOUSE_SERVICE_EMAIL:-projecta@warehouse.local}
  WAREHOUSE_SERVICE_PASSWORD: ${WAREHOUSE_SERVICE_PASSWORD:-change-me-service-password}
  WAREHOUSE_WEBHOOK_SECRET: ${WAREHOUSE_WEBHOOK_SECRET:-change-me-shared-secret}

# --- ProjectB (warehouse service in support/) -------------------------------
# Fully described here (no env_file) so nothing of ProjectA's .env leaks into it.
x-warehouse-env: &warehouse-env
  DJANGO_SETTINGS_MODULE: ${WAREHOUSE_DJANGO_SETTINGS_MODULE:-support.settings.development}
  DJANGO_SECRET_KEY: ${WAREHOUSE_SECRET_KEY:-change-me-warehouse-secret-key-0123456789-0123456789}
  DJANGO_ALLOWED_HOSTS: ${WAREHOUSE_ALLOWED_HOSTS:-localhost,127.0.0.1,warehouse-web}
  CSRF_TRUSTED_ORIGINS: ${WAREHOUSE_CSRF_TRUSTED_ORIGINS:-http://localhost:8001,http://127.0.0.1:8001}
  DJANGO_SECURE_SSL_REDIRECT: "False"   # TLS (if any) terminates in front of nginx
  POSTGRES_DB: ${WAREHOUSE_POSTGRES_DB:-warehouse_db}
  POSTGRES_USER: ${WAREHOUSE_POSTGRES_USER:-warehouse_user}
  POSTGRES_PASSWORD: ${WAREHOUSE_POSTGRES_PASSWORD:-change-me-warehouse-db-password}
  POSTGRES_HOST: warehouse-db
  POSTGRES_PORT: "5432"
  REDIS_HOST: redis
  # ProjectA uses Redis DBs 0/1/2 - keep ProjectB on 3/4/5.
  REDIS_BROKER_DB: "3"
  REDIS_CACHE_DB: "4"
  REDIS_RESULT_DB: "5"
  CELERY_BROKER_URL: redis://redis:6379/3
  CELERY_RESULT_BACKEND: redis://redis:6379/5
  SERVICE_ACCOUNT_EMAIL: ${WAREHOUSE_SERVICE_EMAIL:-projecta@warehouse.local}
  SERVICE_ACCOUNT_PASSWORD: ${WAREHOUSE_SERVICE_PASSWORD:-change-me-service-password}
  WEBHOOK_SECRET: ${WAREHOUSE_WEBHOOK_SECRET:-change-me-shared-secret}
  PROJECTA_WEBHOOK_URL: http://web:8000/api/warehouse/webhook/

services:
  redis:
    image: redis:7-alpine
    container_name: redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    restart: always
    networks:
      - books_shop_network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================ ProjectA: book shop ============================
  books_db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - books_pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 20s
      timeout: 10s
      retries: 5
    networks:
      - books_shop_network

  web:
    <<: *app
    working_dir: /app/book_shop
    command: >
      sh -c "chmod +x entrypoint.sh && ./entrypoint.sh && python manage.py collectstatic --noinput && gunicorn book_shop.wsgi:application --bind 0.0.0.0:8000 --workers 3 --access-logfile - --error-logfile -"
    env_file:
      - .env
    environment:
      <<: *bookshop-env
    volumes:
      - django_static:/app/book_shop/staticfiles
      - healthchecks:/app/healthchecks
    expose:
      - "8000"
    depends_on:
      books_db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request as u; u.urlopen(u.Request('http://localhost:8000/', headers={'X-Forwarded-Proto': 'https'}))" ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  celery:
    <<: *app
    working_dir: /app/book_shop
    command: celery -A book_shop worker -l info
    env_file:
      - .env
    environment:
      <<: *bookshop-env
    depends_on:
      web:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-beat:
    <<: *app
    working_dir: /app/book_shop
    command: celery -A book_shop beat -l info -s /tmp/celerybeat-schedule
    env_file:
      - .env
    environment:
      <<: *bookshop-env
    depends_on:
      redis:
        condition: service_healthy

  # ====================== ProjectB: warehouse service (support/) ======================
  warehouse-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${WAREHOUSE_POSTGRES_DB:-warehouse_db}
      POSTGRES_USER: ${WAREHOUSE_POSTGRES_USER:-warehouse_user}
      POSTGRES_PASSWORD: ${WAREHOUSE_POSTGRES_PASSWORD:-change-me-warehouse-db-password}
    volumes:
      - warehouse_pg_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${WAREHOUSE_POSTGRES_USER:-warehouse_user} -d ${WAREHOUSE_POSTGRES_DB:-warehouse_db}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - books_shop_network

  warehouse-web:
    <<: *app
    working_dir: /app/support
    # entrypoint.sh (RUN_MIGRATIONS=1): migrate, collectstatic, create the service account.
    command: >
      sh -c "RUN_MIGRATIONS=1 sh entrypoint.sh gunicorn support.wsgi:application --bind 0.0.0.0:8000 --workers 3 --access-logfile - --error-logfile -"
    environment:
      <<: *warehouse-env
    volumes:
      - warehouse_static:/app/support/staticfiles
    expose:
      - "8000"
    depends_on:
      warehouse-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health/')" ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  warehouse-celery:
    <<: *app
    working_dir: /app/support
    command: celery -A support worker -l info
    environment:
      <<: *warehouse-env
    depends_on:
      warehouse-web:
        condition: service_healthy

  warehouse-celery-beat:
    <<: *app
    working_dir: /app/support
    command: celery -A support beat -l info -s /tmp/celerybeat-schedule
    environment:
      <<: *warehouse-env
    depends_on:
      warehouse-web:
        condition: service_healthy

  # ============================ shared reverse proxy ============================
  nginx:
    image: nginx:1.27-alpine
    container_name: nginx
    ports:
      - "80:80"      # ProjectA
      - "8001:8001"  # ProjectB
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - django_static:/srv/static/book_shop:ro
      - warehouse_static:/srv/static/support:ro
    depends_on:
      web:
        condition: service_healthy
      warehouse-web:
        condition: service_healthy
    restart: always
    networks:
      - books_shop_network

networks:
  books_shop_network:
    driver: bridge

volumes:
  django_static:
  warehouse_static:
  healthchecks:
  redis_data:
  books_pg_data:
  warehouse_pg_data:
